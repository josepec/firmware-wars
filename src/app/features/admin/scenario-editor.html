<div class="min-h-screen p-6 md:p-10 max-w-5xl mx-auto">

  <div class="flex items-center justify-between mb-8">
    <div>
      <div class="text-[10px] tracking-[0.3em] text-green-500/50 mb-1">// ADMIN</div>
      <h1 class="text-lg tracking-[0.15em] text-green-400 font-bold uppercase"
          style="font-family: 'Orbitron', monospace;">
        {{ editId() ? 'Editar' : 'Nuevo' }} Escenario
      </h1>
    </div>
    <a routerLink="/admin"
      class="px-4 py-2 text-[10px] tracking-[0.15em] uppercase
             border border-green-500/15 text-green-500/40
             hover:text-green-400 hover:border-green-500/30 transition-all">
      Volver
    </a>
  </div>

  @if (loading()) {
  <div class="text-[10px] tracking-[0.2em] text-green-500/40 animate-pulse py-8">
    > LOADING...
  </div>
  } @else {

  @if (error()) {
  <div class="mb-4 text-[10px] tracking-[0.2em] text-red-400/80 border border-red-500/20 px-4 py-2.5">
    > {{ error() }}
  </div>
  }

  <div class="flex flex-col gap-6">

    <!-- Titulo -->
    <div class="scenario-field">
      <label class="field-label">Titulo</label>
      <input type="text" [ngModel]="title()" (ngModelChange)="title.set($event)"
             class="field-input" placeholder="Nombre del escenario" />
    </div>

    <!-- Ambientacion -->
    <div class="scenario-field">
      <label class="field-label">Ambientacion</label>
      <textarea [ngModel]="ambientacion()" (ngModelChange)="ambientacion.set($event)"
                class="field-textarea" rows="4" placeholder="Texto narrativo..."></textarea>
    </div>

    <!-- Objetivo -->
    <div class="scenario-field">
      <label class="field-label">Objetivo</label>
      <textarea [ngModel]="objetivo()" (ngModelChange)="objetivo.set($event)"
                class="field-textarea" rows="3" placeholder="Condiciones de victoria..."></textarea>
    </div>

    <!-- Recompensa -->
    <div class="scenario-field">
      <label class="field-label">Recompensa</label>
      <textarea [ngModel]="recompensa()" (ngModelChange)="recompensa.set($event)"
                class="field-textarea" rows="2" placeholder="Recompensas especiales..."></textarea>
    </div>

    <!-- Amenazas -->
    <div class="scenario-field">
      <label class="field-label">Amenazas</label>
      <textarea [ngModel]="amenazas()" (ngModelChange)="amenazas.set($event)"
                class="field-textarea" rows="3" placeholder="Enemigos, trampas, peligros..."></textarea>
    </div>

    <!-- Entorno Digitalizado de Combate -->
    <div>
      <label class="field-label mb-3 block">Entorno Digitalizado de Combate</label>
      <app-hex-map-editor [(mapData)]="hexMap" />
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-3 pt-4 border-t border-green-500/10">
      <button (click)="save()" type="button" [disabled]="saving()"
        class="px-6 py-2.5 text-[10px] tracking-[0.2em] uppercase
               bg-green-500/15 border border-green-500/40 text-green-400
               hover:bg-green-500/25 hover:border-green-400/60 transition-all
               disabled:opacity-50 cursor-pointer">
        @if (saving()) { GUARDANDO... } @else { Guardar }
      </button>
      <a routerLink="/admin"
        class="px-6 py-2.5 text-[10px] tracking-[0.2em] uppercase
               border border-green-500/15 text-green-500/40
               hover:text-green-400 transition-all">
        Cancelar
      </a>
    </div>

  </div>
  }

</div>
