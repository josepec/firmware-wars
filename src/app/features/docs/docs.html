<div class="flex flex-col md:flex-row min-h-screen">

  <!-- Sidebar ───────────────────────────────────────────────── -->
  <aside class="bg-black/85 backdrop-blur-sm border-b md:border-b-0 md:border-r border-green-500/15
                sticky top-0 z-30
                md:w-56 md:flex-shrink-0 md:h-screen md:overflow-y-auto">

    <!-- ── Desktop header ────────────────────────────────────── -->
    <div class="hidden md:block px-6 pt-6 pb-3">
      <span class="text-[10px] tracking-[0.4em] text-green-500/55">// REGLAMENTO</span>
    </div>

    <!-- ── Mobile nav: dropdown ──────────────────────────────── -->
    <nav class="md:hidden py-2 px-3 mobile-nav-dropdown">
      <div class="flex items-center gap-2">

        <!-- Dropdown trigger -->
        <button (click)="toggleMobileMenu()" type="button"
          class="flex-1 flex items-center gap-2 px-3 py-2 text-[10px] tracking-[0.15em] uppercase
                 text-green-400 border border-green-500/25 bg-green-500/5
                 hover:border-green-400/40 transition-all">
          <span class="text-green-500/40 text-[8px] transition-transform duration-200"
            [class.rotate-180]="mobileMenuOpen()">▼</span>
          @if (currentSection(); as s) {
            <span>{{ s.subtitle }}</span>
          } @else {
            <span class="text-green-500/40">Seleccionar sección</span>
          }
        </button>

        <!-- PDF button -->
        <a [href]="pdfUrl" target="_blank" rel="noopener" aria-label="Descargar manual PDF"
          class="flex items-center justify-center px-2.5 py-2 border border-green-500/40 bg-green-500/10
                 text-green-400 hover:bg-green-500/20 hover:border-green-400/60 transition-all">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <path d="M12 16V4M12 16l-4-4M12 16l4-4" />
            <path d="M4 20h16" />
          </svg>
        </a>
      </div>

      <!-- Dropdown list -->
      @if (mobileMenuOpen()) {
      <ul class="mt-1 border border-green-500/20 bg-black/95 backdrop-blur-sm
                 max-h-[60vh] overflow-y-auto">
        @for (s of sections(); track s.id) {
        <li>
          <a [routerLink]="'/docs/' + s.id" routerLinkActive="!text-green-300 !bg-green-500/10"
            class="block px-4 py-2.5 text-[10px] tracking-[0.12em] uppercase
                   text-green-400/55 hover:text-green-300 hover:bg-green-500/5 transition-colors
                   border-b border-green-500/8 last:border-b-0">
            <span class="text-green-500/25 mr-2">{{ s.num }}</span>
            {{ s.subtitle }}
          </a>
        </li>
        }
      </ul>
      }
    </nav>

    <!-- ── Desktop nav: vertical ─────────────────────────────── -->
    <nav class="hidden md:block px-6 pb-6">
      <ul class="flex flex-col gap-0.5">
        @for (s of sections(); track s.id) {
        <li>
          <a [routerLink]="'/docs/' + s.id" routerLinkActive="text-green-400 border-l-2 border-green-400 pl-3" class="block text-green-400/60 hover:text-green-300 transition-colors
                   py-1 pl-0 text-xs tracking-widest uppercase">
            {{ s.subtitle }}
          </a>
        </li>
        }
      </ul>

      <!-- ── PDF download ──────────────────────────────────────── -->
      <div class="mt-5 pt-4 border-t border-green-500/15">
        <a [href]="pdfUrl" target="_blank" rel="noopener"
          class="flex items-center justify-center gap-2 px-3 py-2 text-[10px] tracking-[0.2em] uppercase
                 text-green-400 bg-green-500/10 hover:bg-green-500/20 border border-green-500/40
                 hover:border-green-400/60 transition-all">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
            stroke-linecap="round">
            <path d="M12 16V4M12 16l-4-4M12 16l4-4" />
            <path d="M4 20h16" />
          </svg>
          Descargar PDF
        </a>
      </div>
    </nav>

  </aside>

  <!-- Content ───────────────────────────────────────────────── -->
  <main class="flex-1 min-w-0 p-6 md:p-10 max-w-4xl relative z-20 overflow-x-hidden">
    @if (markdownSrc) {
    <markdown [src]="markdownSrc" [disableSanitizer]="true" (load)="onMarkdownReady()" />
    } @else {
    <p class="text-green-400/65 text-xs tracking-widest">
      &gt; Selecciona una sección del menú.<span class="cursor-blink ml-1">&#9646;</span>
    </p>
    }
  </main>

</div>
